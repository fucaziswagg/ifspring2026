<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Buttons &mdash; Bean Royal</title>

    <link
        href='https://fonts.googleapis.com/css?family=Open+Sans:400,300,300italic,400italic,600,600italic,700,700italic,800,800italic'
        rel='stylesheet' type='text/css'>
    <link href='https://fonts.googleapis.com/css?family=Montserrat' rel='stylesheet' type='text/css'>
    <link href='https://fonts.googleapis.com/css?family=Ubuntu:700' rel='stylesheet' type='text/css'>

    <link href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet"
        integrity="sha384-wvfXpqpZZVQGK6TAh5PVlGOfQNHSoD2xbE+QkPxCAFlNEevoEH3Sl0sibVcOQVnN" crossorigin="anonymous">

    <meta name="author" content="Bean Royal">
    <meta name="description" content="Complete a page of 5 buttons (not including the ones already on the starter page), with each button linking 
        to a URL from the 'Button Targets' list referenced below. Each button should stylistically represent the page it targets, 
        making each one unique. Although the links and buttons on the target page will likely inform your design choices, 
        don't simply replicate the button style used within the site. Rather, aim to define your own style that represents 
        the target site as a whole. Your objective is to learn and practice using many different style controls in order to 
        achieve a wide variety of finished 'looks.'">
    <meta name="copyright" content="2026 Bean Royal">
    <meta name="generator" content="VS Code">
    <meta name="rating" content="general">
    <link rel="stylesheet" type="text/css" href="styles/source_styles.css">
    <link rel="stylesheet" type="text/css" href="styles/styles.css">
    <script src="https://kit.fontawesome.com/844a207ff7.js" crossorigin="anonymous"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Pacifico&family=Yellowtail&display=swap');
    </style>
</head>

<body>

    <main>

        <div>
            <h1>Example Button Styling</h1>

            <div class="button_container">
                <a href="http://www.spotify.com" target="_blank" id="btn_spotify">Spotify</a>
            </div>

            <div class="button_container">
                <a href="http://www.amazon.com" target="_blank" id="btn_amazon"><i class="fa fa-amazon"></i></a>
            </div>

            <div class="button_container">
                <a href="http://www.twitter.com" target="_blank" id="btn_twitter">twitter</a>
            </div>

            <div class="button_container">
                <a href="http://www.indiegogo.com" target="_blank" id="btn_indiegogo"><span>indiegogo</span></a>
            </div>
        </div>
        <div>
            <h1>Custom Button Styling &mdash; Bean Royal</h1>

            <div class="button_container my-container" id="hasbro-container">
                <a href="https://shop.hasbro.com/en-us/welcome-check?brand=nerf" target="_blank" id="btn-hasbro">
                    <span>H</span>
                    <span>a</span>
                    <span>s</span>
                    <span>b</span>
                    <span>r</span>
                    <span>o</span>
                </a>
            </div>

            <div class="button_container my-container" id="moo-container">
                <a href="http://www.moo.com/us/" target="_blank" id="btn-moo">
                    <span>Shop MOO</span>
                </a>
            </div>

            <div class="button_container my-container" id="apple-container">
                <a href="https://www.apple.com/macbook-neo/" target="_blank" id="btn-apple">
                    <i class="fa-brands fa-apple fa-lg"></i>
                    <span>Apple</span>
                </a>
            </div>

            <div class="button_container my-container" id="coke-container">
                <a href="http://www.coca-cola.com/" target="_blank" id="btn-coke" class="coke-button">
                    <img src="https://logodix.com/logo/80256.png" width="100px" alt="coca-cola logo">
                </a>
            </div>
            
            <div class="button_container my-container" id="ebike-container">
                <a href="https://electra.trekbikes.com/us/en_US/" target="_blank" id="btn-ebike">
                    <span>Electra Bikes</span>
                </a>
            </div>
        </div>

    </main>

</body>

</html>
